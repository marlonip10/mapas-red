<script>

var graph = document.getElementsByClassName('plotly-graph-div')[0];


// ==========================================================
// OBTENER TIPOS DE BENEFICIARIO
// ==========================================================

var tipos = new Set();

graph.data.forEach(function(trace){

    if(!trace.customdata){
        return;
    }

    trace.customdata.forEach(function(row){

        var tipo = row[1];

        if(tipo){
            tipos.add(tipo);
        }

    });

});

tipos = Array.from(tipos).sort();


// ==========================================================
// CREAR CHECKBOXES
// ==========================================================

var filtros = document.getElementById("filtros");

tipos.forEach(function(tipo, index){

    var id = "filtro_" + index;

    var label = document.createElement("label");
    label.className = "filtro-item";

    var checkbox = document.createElement("input");

    checkbox.type = "checkbox";
    checkbox.id = id;
    checkbox.value = tipo;
    checkbox.checked = true;

    checkbox.addEventListener("change", actualizarFiltro);

    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(" " + tipo));

    filtros.appendChild(label);

});


// ==========================================================
// OBTENER TIPOS SELECCIONADOS
// ==========================================================

function obtenerSeleccionados(){

    var seleccionados = [];

    document.querySelectorAll("#filtros input[type='checkbox']")
        .forEach(function(checkbox){

            if(checkbox.checked){
                seleccionados.push(checkbox.value);
            }

        });

    return seleccionados;
}

// ACTUALIZAR MAPA
// ==========================================================

function actualizarFiltro(){

    var seleccionados = obtenerSeleccionados();

    var restyle = [];
    var indices = [];

    graph.data.forEach(function(trace, i){

        if(!trace.customdata){
            return;
        }

        var opacidades = [];
        var cantidad = 0;

        trace.customdata.forEach(function(row){

            var tipo = row[1];

            if(seleccionados.includes(tipo)){

                opacidades.push(1);
                cantidad++;

            }else{

                opacidades.push(0);

            }

        });

        restyle.push({
            "marker.opacity": [opacidades],
            "name": obtenerNombre(trace.name) + "                 " + cantidad
        });

        indices.push(i);

    });

    Plotly.restyle(
        graph,
        restyle,
        indices
    );

    actualizarZonas(seleccionados);

    actualizarTotal(seleccionados);

}


// ==========================================================
// OBTENER NOMBRE UP / DOWN
// ==========================================================

function obtenerNombre(nombre){

    return nombre.trim().split(/\s+/)[0];

}


// ==========================================================
// ACTUALIZAR PANEL ZONAS
// ==========================================================

function actualizarZonas(seleccionados){

    var zonas = {};
    var total = 0;

    graph.data.forEach(function(trace){

        if(!trace.customdata){
            return;
        }

        trace.customdata.forEach(function(row){

            var zona = row[0];
            var tipo = row[1];

            if(seleccionados.includes(tipo)){

                zonas[zona] = (zonas[zona] || 0) + 1;

                total++;

            }

        });

    });

    var html = "ZONAS<br><br>";

    for(var z in zonas){

        html += z + " : " + zonas[z] + "<br>";

    }

    document.getElementById("panel-zonas").innerHTML = html;

}


// ==========================================================
// ACTUALIZAR TOTAL DEL MAPA
// ==========================================================

function actualizarTotal(seleccionados){

    var total = 0;

    graph.data.forEach(function(trace){

        if(!trace.customdata){
            return;
        }

        trace.customdata.forEach(function(row){

            if(seleccionados.includes(row[1])){
                total++;
            }

        });

    });

    graph.layout.legend.title.text =
        "Beneficiarios Huanuco<br>Total: " + total;

    Plotly.relayout(
        graph,
        {
            "legend.title.text":
            "Beneficiarios Huanuco<br>Total: " + total
        }
    );

}


// ==========================================================
// TODOS
// ==========================================================

function seleccionarTodos(){

    document.querySelectorAll("#filtros input[type='checkbox']")
        .forEach(function(checkbox){

            checkbox.checked = true;

        });

    actualizarFiltro();

}


// ==========================================================
// NINGUNO
// ==========================================================

function deseleccionarTodos(){

    document.querySelectorAll("#filtros input[type='checkbox']")
        .forEach(function(checkbox){

            checkbox.checked = false;

        });

    actualizarFiltro();

}


// ==========================================================
// INICIALIZAR
// ==========================================================

actualizarFiltro();

</script>
</body>
</html>
