<div id="panel-filtros">

    <h3>TIPO DE BENEFICIARIO</h3>

    <div id="lista-filtros"></div>

    <button class="boton-filtro" onclick="seleccionarTodos()">
        TODOS
    </button>

    <button class="boton-filtro" onclick="deseleccionarTodos()">
        NINGUNO
    </button>

</div>

<div id="panel-zonas"></div>

<script>

var graph = document.getElementsByClassName('plotly-graph-div')[0];


// ======================================================
// OBTENER TODAS LAS CATEGORÍAS
// ======================================================

var categoriasBeneficiario = new Set();

graph.data.forEach(function(trace){

    if(!trace.customdata){
        return;
    }

    trace.customdata.forEach(function(row){

        var tipo = row[1];

        if(tipo !== null && tipo !== undefined){
            categoriasBeneficiario.add(String(tipo));
        }

    });

});


// Convertir Set a Array y ordenar

var categorias = Array.from(categoriasBeneficiario).sort();


// Guardar datos originales

var datosOriginales = [];

graph.data.forEach(function(trace){

    datosOriginales.push({

        x: trace.x ? trace.x.slice() : [],
        y: trace.y ? trace.y.slice() : [],
        lat: trace.lat ? trace.lat.slice() : [],
        lon: trace.lon ? trace.lon.slice() : [],
        text: trace.text ? trace.text.slice() : [],
        customdata: trace.customdata ? trace.customdata.slice() : []

    });

});


// ======================================================
// CREAR CHECKBOXES
// ======================================================

function crearFiltros(){

    var contenedor = document.getElementById("lista-filtros");

    contenedor.innerHTML = "";

    categorias.forEach(function(categoria, index){

        var div = document.createElement("div");

        div.className = "filtro-item";

        var checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = true;
        checkbox.id = "filtro_" + index;
        checkbox.value = categoria;

        checkbox.onchange = aplicarFiltros;

        var label = document.createElement("label");

        label.htmlFor = checkbox.id;

        label.innerHTML = " " + categoria;

        div.appendChild(checkbox);
        div.appendChild(label);

        contenedor.appendChild(div);

    });

}


// ======================================================
// OBTENER CATEGORÍAS SELECCIONADAS
// ======================================================

function obtenerSeleccionados(){

    var seleccionados = [];

    categorias.forEach(function(categoria, index){

        var checkbox = document.getElementById(
            "filtro_" + index
        );

        if(checkbox && checkbox.checked){

            seleccionados.push(categoria);

        }

    });

    return seleccionados;

}


// ======================================================
// APLICAR FILTRO
// ======================================================

function aplicarFiltros(){

    var seleccionados = obtenerSeleccionados();

    graph.data.forEach(function(trace, traceIndex){

        var original = datosOriginales[traceIndex];

        var indices = [];

        original.customdata.forEach(function(row, i){

            var tipo = String(row[1]);

            if(seleccionados.includes(tipo)){

                indices.push(i);

            }

        });


        // Filtrar los campos del trace

        var nuevos = {};

        if(original.lat){
            nuevos.lat = indices.map(i => original.lat[i]);
        }

        if(original.lon){
            nuevos.lon = indices.map(i => original.lon[i]);
        }

        if(original.x){
            nuevos.x = indices.map(i => original.x[i]);
        }

        if(original.y){
            nuevos.y = indices.map(i => original.y[i]);
        }

        if(original.text){
            nuevos.text = indices.map(i => original.text[i]);
        }

        if(original.customdata){
            nuevos.customdata = indices.map(i => original.customdata[i]);
        }

        Plotly.restyle(
            graph,
            nuevos,
            [traceIndex]
        );

    });


    actualizarZonas();

}


// ======================================================
// SELECCIONAR TODOS
// ======================================================

function seleccionarTodos(){

    categorias.forEach(function(categoria, index){

        var checkbox = document.getElementById(
            "filtro_" + index
        );

        if(checkbox){
            checkbox.checked = true;
        }

    });

    aplicarFiltros();

}


// ======================================================
// DESELECCIONAR TODOS
// ======================================================

function deseleccionarTodos(){

    categorias.forEach(function(categoria, index){

        var checkbox = document.getElementById(
            "filtro_" + index
        );

        if(checkbox){
            checkbox.checked = false;
        }

    });

    aplicarFiltros();

}


// ======================================================
// ACTUALIZAR PANEL DE ZONAS
// ======================================================

function actualizarZonas(){

    var zonas = {};
    var total = 0;

    graph.data.forEach(function(trace){

        if(trace.visible === "legendonly"){
            return;
        }

        if(!trace.customdata){
            return;
        }

        trace.customdata.forEach(function(row){

            var zona = row[0];

            zonas[zona] = (zonas[zona] || 0) + 1;

            total++;

        });

    });


    var html = "ZONAS<br><br>";

    for(var z in zonas){

        html += z + " : " + zonas[z] + "<br>";

    }

    html += "<br>TOTAL : " + total;

    document.getElementById(
        "panel-zonas"
    ).innerHTML = html;

}


// ======================================================
// EVENTO DE LA LEYENDA UP / DOWN
// ======================================================

graph.on(
    'plotly_restyle',
    function(){

        actualizarZonas();

    }
);


// ======================================================
// INICIALIZAR
// ======================================================

crearFiltros();

actualizarZonas();

</script>
