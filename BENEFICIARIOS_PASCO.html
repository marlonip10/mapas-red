}

#panel-buscador button{
    margin-top:6px;
    width:100%;
    padding:4px;
    font-family:Courier New;
    cursor:pointer;

<div id="panel-zonas"></div>

<script>

var graph = document.getElementsByClassName('plotly-graph-div')[0]
var TITULO = "RTs Pasco"
var ANCHO = 18

// ================================
// DATOS ORIGINALES POR TRAZA (una traza por estado)
// Se usa _fullData porque ahí Plotly guarda las coordenadas decodificadas
// ================================
var nTrazas = graph.data.length
var originales = []

graph._fullData.forEach(function(t){
    if(t.index >= nTrazas) return
    originales[t.index] = {
        lat: Array.from(t.lat || []),
        lon: Array.from(t.lon || []),
        customdata: Array.from(t.customdata || []),
        hovertext: Array.from(t.hovertext || []),
        categoria: String(t.name).slice(0, ANCHO).trim()
    }
})

var actuales = originales

// ================================
// PANELES
// ================================
var panelZonas = document.getElementById("panel-zonas")

var buscador = document.createElement("div")
buscador.id = "panel-buscador"
buscador.innerHTML =
    'BUSCAR BENEFICIARIO<br><br>' +
    '<input id="input-nodo" list="lista-nodos" placeholder="Nombre o código...">' +
    '<datalist id="lista-nodos"></datalist>' +
    '<button id="btn-vista-general">Vista general</button>'
document.body.appendChild(buscador)

var panelTipos = document.createElement("div")
panelTipos.id = "panel-tipos"
panelTipos.innerHTML =
    'TIPO DE BENEFICIARIO<br><br>' +
    '<div id="lista-tipos"></div>' +
    '<div class="botones">' +
    '<button id="btn-tipos-todos">Todos</button>' +
    '<button id="btn-tipos-ninguno">Ninguno</button>' +
    '</div>'
document.body.appendChild(panelTipos)

// ================================
// PANEL DE ZONAS
// ================================
function actualizarZonas(){

    var zonas = {}

    // Usa los RTs del filtro de tipo y respeta los estados ocultos en la leyenda
    actuales.forEach(function(t, i){

        if(graph.data[i] && graph.data[i].visible === "legendonly"){
            return
        }

        t.customdata.forEach(function(row){
            var zona = row[0] || "SIN ZONA"
            zonas[zona] = (zonas[zona] || 0) + 1
        })
    })

    var html = "ZONAS<br><br>"

    var claves = Object.keys(zonas).sort()
    if(claves.length === 0) html += "(sin RTs)<br>"

    claves.forEach(function(z){
        html += z + " : " + zonas[z] + "<br>"
    })

    panelZonas.innerHTML = html
}

// ================================
// POSICIÓN: leyenda > zonas > buscador > tipos
// ================================
function posicionarPaneles(){

    var leyenda = graph.querySelector(".legend")
    if(leyenda){
        var r = leyenda.getBoundingClientRect()
        panelZonas.style.top = (r.bottom + 10) + "px"
        panelZonas.style.left = r.left + "px"
    }

    var left = panelZonas.style.left || "18px"
    var ancho = Math.max(panelZonas.offsetWidth, 220)

    buscador.style.left  = left
    buscador.style.width = ancho + "px"
    buscador.style.top   = (panelZonas.offsetTop + panelZonas.offsetHeight + 10) + "px"

    var topTipos = buscador.offsetTop + buscador.offsetHeight + 10
    panelTipos.style.left      = left
    panelTipos.style.minWidth  = ancho + "px"
    panelTipos.style.top       = topTipos + "px"
    panelTipos.style.maxHeight = Math.max(window.innerHeight - topTipos - 15, 120) + "px"
}

function refrescarPaneles(){
    actualizarZonas()
    posicionarPaneles()
}

graph.on('plotly_restyle', refrescarPaneles)
graph.on('plotly_afterplot', posicionarPaneles)
window.addEventListener('resize', posicionarPaneles)

// ================================
// BUSCADOR
// ================================
var vistaInicial = {
    lat: graph.layout.map.center.lat,
    lon: graph.layout.map.center.lon,
    zoom: graph.layout.map.zoom
}

var nodos = {}
var lista = document.getElementById("lista-nodos")

// Índice de búsqueda (nombre y código) solo con los RTs del filtro actual
function construirIndice(){
    nodos = {}
    lista.innerHTML = ""

    actuales.forEach(function(t){
        for(var i = 0; i < t.lat.length; i++){
            var item = {
                etiqueta: String(t.hovertext[i]) + " (" + String(t.customdata[i][4]) + ")",
                lat: Number(t.lat[i]),
                lon: Number(t.lon[i])
            }
            nodos[item.etiqueta.toUpperCase()] = item
        }
    })

    Object.keys(nodos).sort().forEach(function(k){
        var opt = document.createElement("option")
        opt.value = nodos[k].etiqueta
        lista.appendChild(opt)
    })
}

// Resaltar el punto encontrado con un círculo blanco
var indiceResaltado = null
function resaltar(lat, lon){
    if(indiceResaltado !== null){
        Plotly.deleteTraces(graph, indiceResaltado)
        indiceResaltado = null
    }
    if(lat === null) return
    Plotly.addTraces(graph, {
        type: "scattermap",
        lat: [lat],
        lon: [lon],
        mode: "markers",
        marker: {size: 30, color: "white", opacity: 0.45},
        hoverinfo: "skip",
        showlegend: false
    })
    indiceResaltado = graph.data.length - 1
}

function irAlNodo(texto){
    var clave = texto.trim().toUpperCase()
    if(!clave) return

    var nodo = nodos[clave]

    if(!nodo){
        var k = Object.keys(nodos).find(function(n){ return n.indexOf(clave) !== -1 })
        if(k) nodo = nodos[k]
    }

    if(!nodo){
        alert("No se encontró: " + texto)
        return
    }

    Plotly.relayout(graph, {
        "map.center": {lat: nodo.lat, lon: nodo.lon},
        "map.zoom": 14
    })
    resaltar(nodo.lat, nodo.lon)
}

var inputNodo = document.getElementById("input-nodo")

inputNodo.addEventListener("change", function(){ irAlNodo(this.value) })
inputNodo.addEventListener("keydown", function(e){
    if(e.key === "Enter") irAlNodo(this.value)
})

document.getElementById("btn-vista-general").addEventListener("click", function(){
    inputNodo.value = ""
    resaltar(null, null)
    Plotly.relayout(graph, {
        "map.center": {lat: vistaInicial.lat, lon: vistaInicial.lon},
        "map.zoom": vistaInicial.zoom
    })
})

// ================================
// FILTRO POR TIPO DE BENEFICIARIO (selección múltiple)
// ================================
var conteoTipos = {}
originales.forEach(function(t){
    t.customdata.forEach(function(row){
        var tipo = row[3] || "SIN TIPO"
        conteoTipos[tipo] = (conteoTipos[tipo] || 0) + 1
    })
})

var listaTipos = document.getElementById("lista-tipos")
Object.keys(conteoTipos).sort().forEach(function(tipo){
    var label = document.createElement("label")
    var chk = document.createElement("input")
    chk.type = "checkbox"
    chk.value = tipo
    chk.checked = true
    chk.addEventListener("change", aplicarFiltroTipos)
    label.appendChild(chk)
    label.appendChild(document.createTextNode(" " + tipo + " (" + conteoTipos[tipo] + ")"))
    listaTipos.appendChild(label)
})

function rellenar(texto){
    while(texto.length < ANCHO) texto += " "
    return texto
}

function aplicarFiltroTipos(){

    var seleccion = {}
    listaTipos.querySelectorAll("input:checked").forEach(function(c){
        seleccion[c.value] = true
    })

    resaltar(null, null)

    actuales = originales.map(function(t){
        var r = {lat: [], lon: [], customdata: [], hovertext: [], categoria: t.categoria}
        for(var i = 0; i < t.lat.length; i++){
            if(seleccion[t.customdata[i][3] || "SIN TIPO"]){
                r.lat.push(t.lat[i])
                r.lon.push(t.lon[i])
                r.customdata.push(t.customdata[i])
                r.hovertext.push(t.hovertext[i])
            }
        }
        return r
    })

    // Actualizar puntos y conteos de la leyenda
    var cambios = {lat: [], lon: [], customdata: [], hovertext: [], name: []}
    var total = 0
    actuales.forEach(function(r){
        cambios.lat.push(r.lat)
        cambios.lon.push(r.lon)
        cambios.customdata.push(r.customdata)
        cambios.hovertext.push(r.hovertext)
        cambios.name.push(rellenar(r.categoria) + r.lat.length)
        total += r.lat.length
    })

    var indices = []
    for(var i = 0; i < nTrazas; i++) indices.push(i)

    Plotly.restyle(graph, cambios, indices)
    Plotly.relayout(graph, {"legend.title.text": TITULO + "<br>Total: " + total})

    construirIndice()
    refrescarPaneles()
}

function marcarTodos(valor){
    listaTipos.querySelectorAll("input").forEach(function(c){ c.checked = valor })
    aplicarFiltroTipos()
}

document.getElementById("btn-tipos-todos").addEventListener("click", function(){ marcarTodos(true) })
document.getElementById("btn-tipos-ninguno").addEventListener("click", function(){ marcarTodos(false) })

// ================================
// INICIO
// ================================
construirIndice()
refrescarPaneles()

</script>
</body>
</html>
