/* ======================================================

   ====================================================== */

#panel-zonas{

    position:absolute;

    left:20px;

/* ======================================================

   ====================================================== */

#panel-filtro{

    position:absolute;

    padding:12px;

    font-family:Courier New;

/* ======================================================

   ====================================================== */

#panel-filtro-titulo{

}


/* ======================================================
   CHECKBOX
   ====================================================== */

.filtro-item{

    display:block;

    margin:5px 0;

}


/* ======================================================
   BOTONES
   ====================================================== */

.filtro-botones{

    margin-top:12px;

}


.filtro-botones button{

    font-family:Courier New;

    font-size:12px;

    margin-right:5px;

    cursor:pointer;

}

            tipos.add(
                String(tipo).trim()
            );

        }

    });

});


// Convertir Set a Array
tipos = Array.from(tipos);


// Ordenar alfabéticamente
tipos.sort();


// ========================================================
// CREAR CHECKBOXES
// ========================================================

var filtros =
    document.getElementById("filtros");


tipos.forEach(function(tipo, index){

    var id =
        "filtro_" + index;


    var label =
        document.createElement("label");


    label.className =
        "filtro-item";


    var checkbox =
        document.createElement("input");


    checkbox.type =
        "checkbox";


    checkbox.id =
        id;


    checkbox.value =
        tipo;


    // Inicialmente todos seleccionados
    checkbox.checked =
        true;


    checkbox.addEventListener(
        "change",
        actualizarFiltro
    );


    label.appendChild(
        checkbox
    );


    label.appendChild(
        document.createTextNode(
            " " + tipo
        )
    );


    filtros.appendChild(
        label
    );

});


// ========================================================
// OBTENER TIPOS SELECCIONADOS
// ========================================================

function obtenerSeleccionados(){

    var seleccionados = [];


    document
        .querySelectorAll(
            "#filtros input[type='checkbox']"
        )
        .forEach(function(checkbox){

            if(checkbox.checked){

                seleccionados.push(
                    checkbox.value
                );

            }

        });


    return seleccionados;

}


// ========================================================
// ACTUALIZAR FILTRO
// ========================================================

function actualizarFiltro(){

    var seleccionados =
        obtenerSeleccionados();


    // ====================================================
    // RECORRER LOS TRACE DEL MAPA
    // ====================================================

    graph.data.forEach(function(trace, i){

        if(!trace.customdata){

            return;

        }


        var puntosSeleccionados = [];

        var cantidad = 0;


        // ================================================
        // DETERMINAR QUE PUNTOS SE MUESTRAN
        // ================================================

        trace.customdata.forEach(
            function(row, index){

                var tipo =
                    String(row[1]).trim();


                if(
                    seleccionados.includes(tipo)
                ){

                    // Este punto queda visible
                    puntosSeleccionados.push(
                        index
                    );

                    cantidad++;

                }

            }
        );


        // ================================================
        // ACTUALIZAR LOS PUNTOS DEL TRACE
        // ================================================

        Plotly.restyle(

            graph,

            {
                "selectedpoints":
                    [puntosSeleccionados]
            },

            [i]

        );


        // ================================================
        // ACTUALIZAR CANTIDAD DE UP / DOWN
        // ================================================

        var categoria =
            trace.name
                .trim()
                .split(/\s+/)[0];


        var ANCHO = 18;


        var nuevoNombre =
            categoria +
            " ".repeat(
                Math.max(
                    1,
                    ANCHO - categoria.length
                )
            ) +
            cantidad;


        Plotly.restyle(

            graph,

            {
                "name":
                    [nuevoNombre]
            },

            [i]

        );

    });


    // ====================================================
    // ACTUALIZAR ZONAS
    // ====================================================

    actualizarZonas(
        seleccionados
    );


    // ====================================================
    // ACTUALIZAR TOTAL
    // ====================================================

    actualizarTotal(
        seleccionados
    );

}


// ========================================================
// ACTUALIZAR PANEL ZONAS
// ========================================================

function actualizarZonas(
    seleccionados
){

    var zonas = {};

    var total = 0;


    graph.data.forEach(function(trace){

        if(!trace.customdata){

            return;

        }


        trace.customdata.forEach(
            function(row){

                var zona =
                    String(row[0]).trim();


                var tipo =
                    String(row[1]).trim();


                if(
                    seleccionados.includes(tipo)
                ){

                    zonas[zona] =
                        (zonas[zona] || 0) + 1;

                    total++;

                }

            }
        );

    });


    var html =
        "ZONAS<br><br>";


    // Ordenar las zonas
    Object.keys(zonas)
        .sort()
        .forEach(function(z){

            html +=
                z +
                " : " +
                zonas[z] +
                "<br>";

        });


    document.getElementById(
        "panel-zonas"
    ).innerHTML = html;

}


// ========================================================
// ACTUALIZAR TOTAL
// ========================================================

function actualizarTotal(
    seleccionados
){

    var total = 0;


    graph.data.forEach(function(trace){

        if(!trace.customdata){

            return;

        }


        trace.customdata.forEach(
            function(row){

                var tipo =
                    String(row[1]).trim();


                if(
                    seleccionados.includes(tipo)
                ){

                    total++;

                }

            }
        );

    });


    Plotly.relayout(

        graph,

        {
            "legend.title.text":
                "Beneficiarios Pasco<br>Total: "
                + total
        }

    );

}


// ========================================================
// SELECCIONAR TODOS
// ========================================================

function seleccionarTodos(){

    document
        .querySelectorAll(
            "#filtros input[type='checkbox']"
        )
        .forEach(function(checkbox){

            checkbox.checked =
                true;

        });


    actualizarFiltro();

}


// ========================================================
// DESELECCIONAR TODOS
// ========================================================

function deseleccionarTodos(){

    document
        .querySelectorAll(
            "#filtros input[type='checkbox']"
        )
        .forEach(function(checkbox){

            checkbox.checked =
                false;

        });


    actualizarFiltro();

}


// ========================================================
// INICIALIZAR
// ========================================================

actualizarFiltro();


</script>

</html>
