<div id="panel-zonas"></div>

<script>

var graph = document.getElementsByClassName('plotly-graph-div')[0]

function actualizarZonas(){

    var zonas = {}
    var total = 0

    graph.data.forEach(function(trace){

        if(trace.visible === "legendonly"){
            return
        }

        trace.customdata.forEach(function(row){

            var zona = row[0]

            zonas[zona] = (zonas[zona] || 0) + 1

            total++

        })

    })

    var html = "ZONAS<br><br>"

    for(var z in zonas){

        html += z + " : " + zonas[z] + "<br>"

    }

    document.getElementById("panel-zonas").innerHTML = html

}

graph.on('plotly_restyle', actualizarZonas)

actualizarZonas()

// ================================
// BUSCADOR DE NODOS
// ================================

var panelZonas = document.getElementById("panel-zonas")

// Crear el panel del buscador
var buscador = document.createElement("div")
buscador.id = "panel-buscador"
buscador.innerHTML =
    'BUSCAR NODO<br><br>' +
    '<input id="input-nodo" list="lista-nodos" placeholder="Escribe o elige un nodo...">' +
    '<datalist id="lista-nodos"></datalist>' +
    '<button id="btn-vista-general">Vista general</button>'
document.body.appendChild(buscador)

// Ubicarlo debajo del panel de zonas y con su mismo ancho
function posicionarBuscador(){
    buscador.style.top   = (panelZonas.offsetTop + panelZonas.offsetHeight + 10) + "px"
    buscador.style.width = panelZonas.offsetWidth + "px"
}
posicionarBuscador()
graph.on('plotly_restyle', posicionarBuscador)

// Guardar la vista inicial
var vistaInicial = {
    lat: graph.layout.map.center.lat,
    lon: graph.layout.map.center.lon,
    zoom: graph.layout.map.zoom
}

// Construir el diccionario de nodos (nombre -> coordenadas)
// Se usa _fullData porque ahí Plotly guarda las coordenadas ya decodificadas
var nodos = {}
graph._fullData.forEach(function(trace){
    if(!trace.hovertext || !trace.lat) return
    for(var i = 0; i < trace.hovertext.length; i++){
        var nombre = String(trace.hovertext[i])
        nodos[nombre.toUpperCase()] = {
            nombre: nombre,
            lat: Number(trace.lat[i]),
            lon: Number(trace.lon[i])
        }
    }
})

// Llenar el listado desplegable (orden alfabético)
var lista = document.getElementById("lista-nodos")
Object.keys(nodos).sort().forEach(function(k){
    var opt = document.createElement("option")
    opt.value = nodos[k].nombre
    lista.appendChild(opt)
})

// Resaltar el nodo encontrado con un círculo blanco
var indiceResaltado = null
function resaltar(lat, lon){
    if(indiceResaltado !== null){
        Plotly.deleteTraces(graph, indiceResaltado)
        indiceResaltado = null
    }
    if(lat === null) return
    Plotly.addTraces(graph, {
        type: "scattermap",
        lat: [lat],
        lon: [lon],
        mode: "markers",
        marker: {size: 30, color: "white", opacity: 0.45},
        hoverinfo: "skip",
        showlegend: false,
        customdata: []
    })
    indiceResaltado = graph.data.length - 1
}

// Buscar y hacer zoom
function irAlNodo(texto){
    var clave = texto.trim().toUpperCase()
    if(!clave) return

    var nodo = nodos[clave]

    // Si no es exacto, toma la primera coincidencia parcial
    if(!nodo){
        var k = Object.keys(nodos).find(function(n){ return n.indexOf(clave) !== -1 })
        if(k) nodo = nodos[k]
    }

    if(!nodo){
        alert("No se encontró el nodo: " + texto)
        return
    }

    Plotly.relayout(graph, {
        "map.center": {lat: nodo.lat, lon: nodo.lon},
        "map.zoom": 14
    })
    resaltar(nodo.lat, nodo.lon)
}

var inputNodo = document.getElementById("input-nodo")

inputNodo.addEventListener("change", function(){ irAlNodo(this.value) })
inputNodo.addEventListener("keydown", function(e){
    if(e.key === "Enter") irAlNodo(this.value)
})
