<style>

html, body {
    margin:0;
    padding:0;
    height:100%;
    width:100%;
}

.plotly-graph-div{
    height:100vh !important;
    width:100vw !important;
}


/* ================================
   PANEL ZONAS
   ================================ */

#panel-zonas{

    position:absolute;

    top:180px;
    left:18px;

    background:rgba(255,255,255,0.9);

    padding:12px;

    font-family:Courier New;

    font-size:14px;

    border-radius:6px;

    z-index:10;
}


/* ================================
   PANEL BUSCADOR
   ================================ */

#panel-buscador{

    position:absolute;

    left:18px;

    background:rgba(255,255,255,0.9);

    padding:10px;

    font-family:Courier New;

    font-size:14px;

    border-radius:6px;

    z-index:10;

    width:210px;

    box-sizing:border-box;
}


/* Título */

#titulo-buscador{

    font-weight:bold;

    margin-bottom:6px;
}


/* Caja de búsqueda */

#buscador-nodos{

    width:100%;

    box-sizing:border-box;

    padding:7px;

    border:1px solid #999;

    border-radius:4px;

    font-family:Courier New;

    font-size:13px;

    outline:none;
}


/* Cuando recibe el foco */

#buscador-nodos:focus{

    border:1px solid #333;

}


/* Botón limpiar */

#limpiar-busqueda{

    margin-top:6px;

    width:100%;

    padding:5px;

    border:none;

    border-radius:4px;

    background:#eeeeee;

    font-family:Courier New;

    font-size:12px;

    cursor:pointer;
}


#limpiar-busqueda:hover{

    background:#dddddd;

}

<!-- ================================
     PANEL ZONAS
     ================================ -->

<div id="panel-zonas"></div>


<!-- ================================
     PANEL BUSCADOR
     ================================ -->

<div id="panel-buscador">

    <div id="titulo-buscador">
        BUSCAR NODO
    </div>

    <input
        id="buscador-nodos"
        list="lista-nodos"
        type="text"
        placeholder="Escribir nodo..."
        autocomplete="off"
    >

    <datalist id="lista-nodos"></datalist>

    <button id="limpiar-busqueda">
        LIMPIAR
    </button>

</div>


<script>

var graph = document.getElementsByClassName('plotly-graph-div')[0]


/* =====================================================
   PANEL DE ZONAS
   ===================================================== */

function actualizarZonas(){

    var zonas = {}

    var total = 0


    graph.data.forEach(function(trace){

        if(trace.visible === "legendonly"){
            return
        }


        if(!trace.customdata){
            return
        }


        trace.customdata.forEach(function(row){

            var zona = row[0]

            zonas[zona] = (zonas[zona] || 0) + 1

            total++

        })

    })


    var html = "ZONAS<br><br>"


    for(var z in zonas){

        html += z + " : " + zonas[z] + "<br>"

    }


    document.getElementById("panel-zonas").innerHTML = html


    /* ==============================================
       COLOCAR BUSCADOR DEBAJO DEL PANEL ZONAS
       ============================================== */

    var panelZonas = document.getElementById("panel-zonas")

    var panelBuscador = document.getElementById("panel-buscador")


    panelBuscador.style.top =
        (
            panelZonas.offsetTop +
            panelZonas.offsetHeight +
            10
        ) + "px"

}


/* =====================================================
   CREAR LISTA DE NODOS
   ===================================================== */

function crearListaNodos(){

    var datalist = document.getElementById("lista-nodos")


    var nodos = []


    graph.data.forEach(function(trace){

        if(!trace.hovertext){
            return
        }


        trace.hovertext.forEach(function(nombre){

            if(nombre && !nodos.includes(nombre)){

                nodos.push(nombre)

            }

        })

    })


    /* Orden alfabético */

    nodos.sort(function(a,b){

        return a.localeCompare(b)

    })


    /* Crear opciones */

    nodos.forEach(function(nombre){

        var option = document.createElement("option")

        option.value = nombre

        datalist.appendChild(option)

    })

}


/* =====================================================
   BUSCAR NODO
   ===================================================== */

function buscarNodo(){

    var texto =
        document
        .getElementById("buscador-nodos")
        .value
        .trim()
        .toUpperCase()


    if(texto === ""){

        limpiarBusqueda()

        return

    }


    var encontrado = false


    graph.data.forEach(function(trace){

        if(encontrado){
            return
        }


        if(!trace.hovertext){
            return
        }


        for(var i = 0; i < trace.hovertext.length; i++){

            var nombre =
                String(trace.hovertext[i]).toUpperCase()


            if(nombre === texto){

                var lat = trace.lat[i]

                var lon = trace.lon[i]


                /* ======================================
                   CENTRAR MAPA
                   ====================================== */

                Plotly.relayout(

                    graph,

                    {

                        "map.center.lat": lat,

                        "map.center.lon": lon,

                        "map.zoom": 12

                    }

                )


                /* ======================================
                   CREAR / ACTUALIZAR MARCADOR
                   DE BÚSQUEDA
                   ====================================== */

                mostrarMarcadorBusqueda(lat, lon)


                encontrado = true

                break

            }

        }

    })

}


/* =====================================================
   MARCADOR DEL NODO BUSCADO
   ===================================================== */

function mostrarMarcadorBusqueda(lat, lon){

    var indiceMarcador = -1


    /* Buscar si ya existe el marcador */

    for(var i = 0; i < graph.data.length; i++){

        if(graph.data[i].name === "__BUSQUEDA__"){

            indiceMarcador = i

            break

        }

    }


    var nuevoTrace = {

        type: "scattermap",

        name: "__BUSQUEDA__",

        lat: [lat],

        lon: [lon],

        mode: "markers",

        marker: {

            size: 18,

            color: "white",

            symbol: "circle",

            opacity: 1

        },

        hoverinfo: "skip",

        showlegend: false

    }


    if(indiceMarcador === -1){

        Plotly.addTraces(

            graph,

            nuevoTrace

        )

    }
    else{

        Plotly.restyle(

            graph,

            {

                lat: [[lat]],

                lon: [[lon]]

            },

            [indiceMarcador]

        )

    }

}


/* =====================================================
   LIMPIAR BÚSQUEDA
   ===================================================== */

function limpiarBusqueda(){

    document
        .getElementById("buscador-nodos")
        .value = ""


    /* Eliminar marcador de búsqueda */

    for(var i = graph.data.length - 1; i >= 0; i--){

        if(graph.data[i].name === "__BUSQUEDA__"){

            Plotly.deleteTraces(

                graph,

                i

            )

        }

    }

}


/* =====================================================
   EVENTOS
   ===================================================== */


/* Cuando se escribe */

document
    .getElementById("buscador-nodos")
    .addEventListener(
        "change",
        buscarNodo
    )
